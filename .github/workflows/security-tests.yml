name: Security Tests & Quality Checks

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety || true

      - name: Run Bandit security scan
        continue-on-error: true
        run: |
          bandit -r src/ -f json -o bandit-report.json || echo "Bandit scan completed"
          bandit -r src/ -f txt || echo "Bandit text report completed"

      - name: Check dependencies for vulnerabilities
        continue-on-error: true
        run: |
          safety check --json || echo "Safety check completed"

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: security-reports
          path: bandit-report.json
          if-no-files-found: ignore

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flake8 pylint black isort || true

      - name: Run flake8
        continue-on-error: true
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics || echo "Flake8 completed"
          flake8 src/ --count --exit-zero --max-complexity=10 --statistics

      - name: Run pylint
        continue-on-error: true
        run: |
          pylint src/ --exit-zero || echo "Pylint completed"

      - name: Check code formatting
        continue-on-error: true
        run: |
          black --check src/ || echo "Black check completed"
          isort --check-only src/ || echo "Isort check completed"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || true
          pip install pytest pytest-cov pytest-asyncio || true

      - name: Run tests
        continue-on-error: true
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=html || echo "Tests completed"

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: always()
        continue-on-error: true
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality, test]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: bug-hunter-toolkit:latest
          no-cache: true

      - name: Test Docker image
        continue-on-error: true
        run: |
          docker build -t bug-hunter-toolkit:test .
          docker run bug-hunter-toolkit:test --version || echo "Docker test completed"
