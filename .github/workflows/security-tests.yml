name: Security Tests & Quality

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DEFAULT: "3.11"

jobs:
  # ── Security Scan ────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip

      - name: Install scanners
        run: pip install bandit safety ruff

      - name: Bandit scan
        run: bandit -r src/ -f json -o bandit-report.json -ll
        continue-on-error: true

      - name: Safety dependency check
        run: safety check --json
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports-${{ github.run_id }}
          path: bandit-report.json
          if-no-files-found: ignore

  # ── Code Quality ─────────────────────────────────────────────────────────────
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip

      - name: Install linters
        run: pip install ruff flake8 black isort

      - name: Ruff lint
        run: ruff check src/ --output-format=github

      - name: Flake8 critical errors
        run: flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Black formatting check
        run: black --check src/
        continue-on-error: true

      - name: Isort import order
        run: isort --check-only src/
        continue-on-error: true

  # ── Test Matrix ──────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml loguru click rich dnspython
          pip install pytest pytest-asyncio pytest-cov pytest-mock

      - name: Run tests
        run: pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - uses: codecov/codecov-action@v7
        if: matrix.python-version == env.PYTHON_DEFAULT
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ── Docker Build ──────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: bug-hunter-toolkit:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker build -t bht-test .
          docker run --rm bht-test --version
        continue-on-error: true
